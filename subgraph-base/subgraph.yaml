specVersion: 1.0.0
description: >-
  Recomputable Agents — Base Sepolia read-path. Indexes the live per-action ERC-8281
  anchor's Recorded events so /verify can query a LIVE agent action's anchor through
  The Graph and require it agrees with the raw RPC log read.
repository: https://github.com/Echo-Merlini/verifiable-agents
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: TruthAnchor
    network: base-sepolia
    source:
      address: "0x0963Fd33DF80c94360F2DC22e5c09517AeE7ED5c"
      abi: TruthAnchor
      startBlock: 41658338
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities: [Anchor]
      abis:
        - name: TruthAnchor
          file: ./abis/TruthAnchor.json
      eventHandlers:
        - event: Recorded(indexed bytes32,indexed address)
          handler: handleRecorded
      file: ./src/mapping.ts
